name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Lets the publish step push the rendered site to the gh-pages branch.
permissions:
  contents: write

# A second push while the first is still building would race for gh-pages.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          # Defaults to the latest release. Pin this to whatever `quarto --version`
          # reports on your machine so CI and local renders can't drift apart.
          version: release

      # Only needed if any page executes code that isn't already cached in
      # _freeze/. Delete both steps if the gallery is pure Markdown.
      # - name: Set up Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.12"
      #     cache: pip
      # - run: pip install -r requirements.txt

      - name: Render and publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
